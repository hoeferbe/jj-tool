name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive Android version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag muss dem Format vMAJOR.MINOR.PATCH entsprechen, z. B. v1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code > 2100000000 )); then
            echo "Berechneter versionCode ist zu groß: $version_code" >&2
            exit 1
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build web app and sync Capacitor
        run: |
          npm run build --workspace=@jj-tool/app
          npx cap sync android
        working-directory: apps/app

      - name: Restore signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          python - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          def detect_keystore_type(data: bytes) -> str | None:
              if data.startswith(b'\xfe\xed\xfe\xed'):
                  return 'JKS'

              if len(data) < 5 or data[0] != 0x30:
                  return None

              length_octet = data[1]
              offset = 2
              if length_octet & 0x80:
                  length_size = length_octet & 0x7F
                  if length_size == 0 or len(data) < offset + length_size + 3:
                      return None
                  offset += length_size

              if len(data) < offset + 3 or data[offset] != 0x02:
                  return None

              integer_length_octet = data[offset + 1]
              integer_offset = offset + 2
              if integer_length_octet & 0x80:
                  length_size = integer_length_octet & 0x7F
                  if length_size == 0 or len(data) < integer_offset + length_size + 1:
                      return None
                  integer_length = int.from_bytes(data[integer_offset:integer_offset + length_size], 'big')
                  integer_offset += length_size
              else:
                  integer_length = integer_length_octet

              if integer_length == 0 or len(data) < integer_offset + integer_length:
                  return None

              if int.from_bytes(data[integer_offset:integer_offset + integer_length], 'big') == 3:
                  return 'PKCS12'

              return None

          encoded_keystore = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())
          padded_keystore = encoded_keystore + '=' * (-len(encoded_keystore) % 4)

          try:
              keystore_bytes = base64.b64decode(padded_keystore, validate=True)
          except binascii.Error:
              try:
                  normalized_keystore = padded_keystore.translate(str.maketrans('-_', '+/'))
                  keystore_bytes = base64.b64decode(normalized_keystore, validate=True)
              except binascii.Error as exc:
                  raise SystemExit(f'ANDROID_KEYSTORE_BASE64 ist kein gültiger Base64-String: {exc}')

          keystore_type = detect_keystore_type(keystore_bytes)
          if keystore_type is None:
              raise SystemExit('Keystore-Format konnte aus ANDROID_KEYSTORE_BASE64 nicht erkannt werden.')

          Path(os.environ['RUNNER_TEMP'], 'jagdrevier.keystore').write_bytes(keystore_bytes)
          Path(os.environ['GITHUB_OUTPUT']).write_text(f'store_type={keystore_type}\n', encoding='utf-8')
          PY
          chmod 600 "$RUNNER_TEMP/jagdrevier.keystore"
          keystore_type="$(awk -F= '/^store_type=/{print $2; exit}' "$GITHUB_OUTPUT")"
          if ! keytool -list -storetype "$keystore_type" -keystore "$RUNNER_TEMP/jagdrevier.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore wurde als $keystore_type erkannt, konnte aber mit dem hinterlegten Passwort nicht gelesen werden." >&2
            exit 1
          fi

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/jagdrevier.keystore
          ANDROID_KEYSTORE_TYPE: ${{ steps.keystore.outputs.store_type }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"
        working-directory: apps/app/android

      - name: Prepare APK asset
        run: cp apps/app/android/app/build/outputs/apk/release/app-release.apk "apps/app/android/app/build/outputs/apk/release/jagdrevier-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Mein Jagdrevier ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          files: apps/app/android/app/build/outputs/apk/release/jagdrevier-${{ steps.version.outputs.version_name }}.apk